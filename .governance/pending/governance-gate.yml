name: governance-gate
# Second machine. Fails the push/PR if hooks were bypassed.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
permissions:
  contents: write        # R59: merge-audit reverts illegitimate merges (self-merge / < 300 s)
  pull-requests: read
jobs:
  merge-audit:
    # R38: PR #3 was self-merged 4 s after opening with zero reviews. Server-side rulesets are the
    # real fix (owner must import them); until then every such merge turns main RED here.
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: merge_timing_guard (live PR data)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_CREATED: ${{ github.event.pull_request.created_at }}
          PR_MERGED: ${{ github.event.pull_request.merged_at }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          PR_REVIEWS_URL: ${{ github.event.pull_request.url }}/reviews
        run: python .governance/merge_timing_guard.py
      # R59 (Round 9): a red job AFTER the merge changed nothing for 4 rounds (PR #3/#5/#6/#8).
      # Without the server-side ruleset, the only thing that makes a self-merge worthless is
      # undoing it. Fires only on author==merged_by OR age<300 s; owner merges w/o review are
      # flagged (red) but not reverted. Limitation: GITHUB_TOKEN cannot push edits to
      # .github/workflows — such reverts fail here and stay red for the owner to revert by hand.
      - name: auto-revert illegitimate merge (R59)
        if: failure() && (github.event.pull_request.user.login == github.event.pull_request.merged_by.login)
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          git config user.name  "governance-gate[bot]"
          git config user.email "governance-gate@users.noreply.github.com"
          git fetch -q origin main && git checkout -q main
          git revert -m 1 --no-edit "$MERGE_SHA"
          git commit -q --amend -m "revert(governance): PR #$PR_NUM self-merged by author — R59 auto-revert. Re-open with a non-author APPROVED review and merge via merge_pr.py."
          git push origin HEAD:refs/heads/main
  gate:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Secret scan (tracked files)
        run: python .governance/secret_scan.py --no-remote-check
      - name: Secret scan (full history of this push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python .governance/secret_scan.py --range "${{ github.event.before }}..${{ github.sha }}" --no-remote-check
      - name: Machine-specific path scan
        run: python .governance/path_scan.py
      - name: Parity gate (proposed_files vs published root)
        run: python .governance/verify_sync.py
      - name: init_root.py behavioural probe
        run: python .governance/probe_init_root.py
      - name: req_coverage self-test (protocol checker must pass its own example and fail a broken one)
        run: |
          E=.governance/examples
          python .governance/req_coverage.py $E/req_ledger_round5_example.md --strict-done --source $E/human_message_round5.txt
          if sed '/^REQ-07 ANSWERED/d' $E/req_ledger_round5_example.md | python .governance/req_coverage.py - ; then echo "checker failed to catch a dropped question"; exit 1; fi
          # R37: the agent's real Round-5 turn must FAIL the verbatim-quote check
          if python .governance/req_coverage.py $E/negative_agent_turn_round6.md --source $E/human_message_round5.txt >/tmp/r37 2>&1; then echo "checker missed paraphrase drift (R37)"; exit 1; fi
          grep -q "paraphrase drift" /tmp/r37
          # R36: the same turn must FAIL the DONE-needs-second-system-proof check
          if python .governance/req_coverage.py $E/negative_agent_turn_round6.md --strict-done >/tmp/r36 2>&1; then echo "checker missed DONE-without-proof (R36)"; exit 1; fi
          grep -q "Rule 4" /tmp/r36
      - name: merge_timing_guard self-test (offline; must flag PR #3's real timestamps)
        run: python .governance/merge_timing_guard.py --self-test
      - name: checker family self-tests (attest / claim_check / intent_gate / read_proof) — Round 12
        run: |
          set -e
          python .governance/intent_gate.py --self-test
          python .governance/claim_check.py --self-test
          python .governance/read_proof.py --self-test
          F=docs/audit_reports/context-connect/context-connect/fixtures
          # R81: the Round-12 gist typed "✅ claim_check: prose consistent" under a turn with 16 contradictions → must FAIL with C7
          if python .governance/claim_check.py $F/agent_gist_round12.md >/tmp/r81 2>&1; then echo "claim_check passed the Round-12 gist (R81 missed)"; exit 1; fi
          grep -q "C7" /tmp/r81
          # R83: the Round-12 human message is CONFIRM-FIRST and the agent's turn had no mirror block → must FAIL
          python .governance/intent_gate.py detect $F/human_msg_round12.txt | grep -q "CONFIRM-FIRST"
          if python .governance/intent_gate.py verify $F/agent_gist_round12.md --human $F/human_msg_round12.txt >/tmp/r83 2>&1; then echo "intent_gate passed a CONFIRM-FIRST turn without a mirror block (R83 missed)"; exit 1; fi
          grep -q "mirror" /tmp/r83
          # R84: a diagnosis with no read-proof block → must FAIL
          printf 'The bug is in .governance/attest.py: blocks() skips the footer.\n' > /tmp/diag.md
          if python .governance/read_proof.py check /tmp/diag.md; then echo "read_proof passed a diagnosis without a proof (R84 missed)"; exit 1; fi
          # Round-10 forged block still rejected
          if python .governance/attest.py verify $F/forged_tool_block_round10.md >/dev/null 2>&1; then echo "attest passed a forged block"; exit 1; fi
      - name: intent_gate self-test (Rule 19 — ask-before-act detector)
        run: python .governance/intent_gate.py --self-test
      - name: attest must reject the Round-10 forged tool blocks (Rule 21)
        run: |
          if python .governance/attest.py verify docs/audit_reports/context-connect/context-connect/fixtures/forged_tool_block_round10.md; then echo "attest accepted forged blocks"; exit 1; fi
      - name: claim_check self-test — Round-11 gist prose must contradict its own blocks (Rule 24)
        run: python .governance/claim_check.py --self-test
      - name: attest must accept the Round-11 gist blocks (all genuine) yet flag REGRESSED remote_proof
        run: |
          python .governance/attest.py verify docs/audit_reports/context-connect/context-connect/fixtures/agent_gist_round11.md >/tmp/a11 2>&1 || true
          grep -q "ATTESTED   \[ci_status\]" /tmp/a11 || { cat /tmp/a11; echo "attest lost the unfenced blocks (R78)"; exit 1; }
      - name: req_coverage --full must pass ROUND10_REVIEW and fail with one REQ removed (Rule 23)
        run: |
          D=docs/audit_reports/context-connect/context-connect
          python .governance/req_coverage.py $D/ROUND10_REVIEW.md --source $D/fixtures/human_msg_round10.txt --full
          grep -v 'REQ-12 ' $D/ROUND10_REVIEW.md > /tmp/neg.md
          if python .governance/req_coverage.py /tmp/neg.md --source $D/fixtures/human_msg_round10.txt --full; then echo "--full passed with a dropped REQ"; exit 1; fi
      - name: remote_proof must catch Round-8 phantom files (Rule 18)
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          if python .governance/remote_proof.py proposed_files/CHANGELOG_DECISIONS.md docs/audit_reports/context-connect/context-connect/bundles/round8_final.tar.gz --ref main; then echo "remote_proof failed to flag phantom files"; exit 1; fi
      - name: pre-push hook behavioural test (must block main + inline credential helper, allow feature branch)
        run: |
          set -e
          git init -q --bare /tmp/bare.git
          git clone -q . /tmp/clone && cd /tmp/clone
          git remote set-url origin /tmp/bare.git
          git config core.hooksPath .governance/hooks
          if git push origin HEAD:refs/heads/main >/tmp/o1 2>&1; then echo "hook allowed push to main"; cat /tmp/o1; exit 1; fi
          grep -q "Rule 7" /tmp/o1
          if git -c 'credential.helper=!echo x' push origin HEAD:refs/heads/f1 >/tmp/o2 2>&1; then echo "hook allowed inline credential helper"; exit 1; fi  # secret-scan:allow (negative test)
          grep -q "Rule 8" /tmp/o2
          git push origin HEAD:refs/heads/f2
          echo "hook behaviour OK"
