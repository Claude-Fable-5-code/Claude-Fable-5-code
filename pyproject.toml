[project]
name = "ai-providers-rel"
version = "0.1.0"
description = "Provider reference and migration repository for General AI Core providers"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
