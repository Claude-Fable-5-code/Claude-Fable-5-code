name: governance-gate
# Second machine. Fails the push/PR if hooks were bypassed.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
permissions:
  contents: read
  pull-requests: read
jobs:
  merge-audit:
    # R38: PR #3 was self-merged 4 s after opening with zero reviews. Server-side rulesets are the
    # real fix (owner must import them); until then every such merge turns main RED here.
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: merge_timing_guard (live PR data)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_CREATED: ${{ github.event.pull_request.created_at }}
          PR_MERGED: ${{ github.event.pull_request.merged_at }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          PR_REVIEWS_URL: ${{ github.event.pull_request.url }}/reviews
        run: python .governance/merge_timing_guard.py
  gate:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Secret scan (tracked files)
        run: python .governance/secret_scan.py --no-remote-check
      - name: Secret scan (full history of this push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python .governance/secret_scan.py --range "${{ github.event.before }}..${{ github.sha }}" --no-remote-check
      - name: Machine-specific path scan
        run: python .governance/path_scan.py
      - name: Parity gate (proposed_files vs published root)
        run: python .governance/verify_sync.py
      - name: init_root.py behavioural probe
        run: python .governance/probe_init_root.py
      - name: req_coverage self-test (protocol checker must pass its own example and fail a broken one)
        run: |
          E=.governance/examples
          python .governance/req_coverage.py $E/req_ledger_round5_example.md --strict-done --source $E/human_message_round5.txt
          if sed '/^REQ-07 ANSWERED/d' $E/req_ledger_round5_example.md | python .governance/req_coverage.py - ; then echo "checker failed to catch a dropped question"; exit 1; fi
          # R37: the agent's real Round-5 turn must FAIL the verbatim-quote check
          if python .governance/req_coverage.py $E/negative_agent_turn_round6.md --source $E/human_message_round5.txt >/tmp/r37 2>&1; then echo "checker missed paraphrase drift (R37)"; exit 1; fi
          grep -q "paraphrase drift" /tmp/r37
          # R36: the same turn must FAIL the DONE-needs-second-system-proof check
          if python .governance/req_coverage.py $E/negative_agent_turn_round6.md --strict-done >/tmp/r36 2>&1; then echo "checker missed DONE-without-proof (R36)"; exit 1; fi
          grep -q "Rule 4" /tmp/r36
      - name: merge_timing_guard self-test (offline; must flag PR #3's real timestamps)
        run: python .governance/merge_timing_guard.py --self-test
      - name: checker family self-tests (attest / claim_check / intent_gate / read_proof) — Round 12
        run: |
          set -e
          python .governance/intent_gate.py --self-test
          python .governance/claim_check.py --self-test
          python .governance/read_proof.py --self-test
          F=docs/audit_reports/context-connect/context-connect/fixtures
          # R81: the Round-12 gist typed "✅ claim_check: prose consistent" under a turn with 16 contradictions → must FAIL with C7
          if python .governance/claim_check.py $F/agent_gist_round12.md >/tmp/r81 2>&1; then echo "claim_check passed the Round-12 gist (R81 missed)"; exit 1; fi
          grep -q "C7" /tmp/r81
          # R83: the Round-12 human message is CONFIRM-FIRST and the agent's turn had no mirror block → must FAIL
          python .governance/intent_gate.py detect $F/human_msg_round12.txt | grep -q "CONFIRM-FIRST"
          if python .governance/intent_gate.py verify $F/agent_gist_round12.md --human $F/human_msg_round12.txt >/tmp/r83 2>&1; then echo "intent_gate passed a CONFIRM-FIRST turn without a mirror block (R83 missed)"; exit 1; fi
          grep -q "mirror" /tmp/r83
          # R84: a diagnosis with no read-proof block → must FAIL
          printf 'The bug is in .governance/attest.py: blocks() skips the footer.\n' > /tmp/diag.md
          if python .governance/read_proof.py check /tmp/diag.md; then echo "read_proof passed a diagnosis without a proof (R84 missed)"; exit 1; fi
          # Round-10 forged block still rejected
          if python .governance/attest.py verify $F/forged_tool_block_round10.md >/dev/null 2>&1; then echo "attest passed a forged block"; exit 1; fi
      - name: checker family self-tests (mistakes / edit_proof / self_review / precheck) — Round 13
        run: |
          set -e
          python .governance/mistakes.py --self-test
          python .governance/edit_proof.py --self-test
          python .governance/self_review.py --self-test
          python .governance/precheck.py --self-test
          # R91 (Round 14, Rule 36): a rule recorded twice with no ESC row → recurrence must FAIL
          python .governance/mistakes.py recurrence
          printf '| 2026-01-01T00:00:00Z | 1 | 99 | a |\n| 2026-01-02T00:00:00Z | 1 | 99 | b |\n' >> .governance/MISTAKES.md
          if python .governance/mistakes.py recurrence; then echo "recurrence passed a twice-broken rule with no ESC row (R91 missed)"; exit 1; fi
          git checkout -- .governance/MISTAKES.md
          # R93 (Round 14, Rule 37): placeholder code must be caught; the repo itself must be clean
          python .governance/mock_scan.py --self-test
          python .governance/mock_scan.py $(git ls-files | grep -E '\.(py|js|ts|sh|ps1|bat|yml|yaml|toml)$')
          printf 'def verify_x():\n    pass  # stub\n' > /tmp/r93.py && cp /tmp/r93.py ./r93_tmp.py
          if python .governance/mock_scan.py r93_tmp.py; then echo "mock_scan passed a stub body (R93 missed)"; exit 1; fi
          git add r93_tmp.py
          if python .governance/mock_scan.py --staged; then echo "mock_scan --staged passed a stub body (R93 missed)"; exit 1; fi
          git rm -q --cached r93_tmp.py && rm r93_tmp.py
          # R92 (Round 14, Rule 37): an edit outside --scope A-B must FAIL, inside must PASS
          echo "# r92" >> README.md
          python .governance/edit_proof.py show README.md --scope 1-1000
          if python .governance/edit_proof.py show README.md --scope 1-1; then echo "edit_proof --scope passed an out-of-scope hunk (R92 missed)"; exit 1; fi
          git checkout -- README.md
          # R85: admission with no ledger row → must FAIL
          printf 'I was wrong about the export step; I forgot it entirely and typed the verdict.\n' > /tmp/r85.md
          if python .governance/mistakes.py check /tmp/r85.md; then echo "mistakes passed an unrecorded admission (R85 missed)"; exit 1; fi
          # R86: edit claim with no edit_proof block → must FAIL
          printf 'I fixed .governance/attest.py so the grammar accepts precheck.\n' > /tmp/r86.md
          if python .governance/edit_proof.py check /tmp/r86.md; then echo "edit_proof passed an unproven edit claim (R86 missed)"; exit 1; fi
          # R87: all-✅ self-review with no remote proof → must FAIL
          printf '```self-review\nQ1 attested:   ✅  evidence: sha256=0000000000000000\nQ2 prechecked: ✅  evidence: sha256=0000000000000000\nQ3 skipped:    none\nQ4 pleasing:   none\nQ5 re-read:    ✅  missed: none missed\nQ6 remote:     ✅  evidence: pushed\n```\n' > /tmp/r87.md
          if python .governance/self_review.py check /tmp/r87.md; then echo "self_review passed an all-✅ block with no evidence (R87 missed)"; exit 1; fi
          # R88: a turn with no tool blocks must be stopped by precheck at attest
          printf 'Done, pushed, green.\n' > /tmp/r88.md; printf 'x\n' > /tmp/r88h.txt
          if python .governance/precheck.py /tmp/r88.md --source /tmp/r88h.txt; then echo "precheck passed an empty turn (R88 missed)"; exit 1; fi
      - name: state gate (Rule 35, Round 14) — state file current, PROGRESS present, self-tests, hook negative
        run: |
          set -e
          python .governance/state_gate.py --self-test
          python .governance/state_gate.py verify
          # R90: a turn whose first block is not `state_gate open` must FAIL check
          printf '```text\nprecheck t.md: 1 step(s), source=-, live=no\n✅ precheck: ok\nATTEST tool=precheck sha256=0000000000000000 utc=x head=abc0000 exit=0 cmd=x\n```\n' > /tmp/r90.md
          if python .governance/state_gate.py check /tmp/r90.md; then echo "state_gate passed a turn that never restored state (R90 missed)"; exit 1; fi
          # pre-commit must refuse a commit that touches code but not Root/ai_state.json
          git clone -q . /tmp/sg && cd /tmp/sg && git config core.hooksPath .governance/hooks
          echo "# x" >> README.md && git add README.md
          if git -c user.email=t@t -c user.name=t commit -q -m t >/tmp/o3 2>&1; then echo "pre-commit allowed code without state"; cat /tmp/o3; exit 1; fi
          grep -q "state must move with code" /tmp/o3
          # R93: the same hook must also refuse a stub body (mock_scan wired into pre-commit)
          printf 'def verify_x():\n    pass  # stub\n' > stub.py && git add stub.py
          if git -c user.email=t@t -c user.name=t commit -q -m t >/tmp/o4 2>&1; then echo "pre-commit allowed stub code"; cat /tmp/o4; exit 1; fi
          grep -q "mock_scan: 1 placeholder" /tmp/o4
          echo "state gate OK"
      - name: pre-push hook behavioural test (must block main + inline credential helper, allow feature branch)
        run: |
          set -e
          git init -q --bare /tmp/bare.git
          git clone -q . /tmp/clone && cd /tmp/clone
          git remote set-url origin /tmp/bare.git
          git config core.hooksPath .governance/hooks
          if git push origin HEAD:refs/heads/main >/tmp/o1 2>&1; then echo "hook allowed push to main"; cat /tmp/o1; exit 1; fi
          grep -q "Rule 7" /tmp/o1
          if git -c 'credential.helper=!echo x' push origin HEAD:refs/heads/f1 >/tmp/o2 2>&1; then echo "hook allowed inline credential helper"; exit 1; fi  # secret-scan:allow (negative test)
          grep -q "Rule 8" /tmp/o2
          git push origin HEAD:refs/heads/f2
          echo "hook behaviour OK"
